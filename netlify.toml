# Cau hinh trien khai Netlify (duoc theo doi trong git).
#
# LUU Y: file .netlify/netlify.toml KHONG phai cau hinh that. Do la trang thai
# do Netlify CLI sinh ra, co truong `publish` tro toi duong dan tuyet doi tren
# may cuc bo, va thu muc .netlify da bi .gitignore loai tru. Sua file do khong
# co tac dung gi khi trien khai. Chi file nay moi duoc doc.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Tai nguyen co van tay bam trong ten file, an toan de cache vinh vien.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Trang HTML phai duoc kiem lai moi lan de noi dung cap nhat hien ngay.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
